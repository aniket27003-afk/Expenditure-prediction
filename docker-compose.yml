# PostgreSQL per PRD §6 (optional — app runs on SQLite by default).
# Usage: docker compose up -d
# Then set in .env: DATABASE_URL=postgresql+psycopg://expenses:expenses@localhost:5432/expenses
services:
  db:
    image: postgres:16
    container_name: expenses-db
    environment:
      POSTGRES_USER: expenses
      POSTGRES_PASSWORD: expenses
      POSTGRES_DB: expenses
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
